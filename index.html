<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voryda Sheet</title>
<link rel="icon" href="app.ico">
<style>
  :root{
    --bg:#0b0e13; --panel:#11161e; --panel2:#171d27; --line:#232b38;
    --text:#e8edf3; --muted:#8b96a5; --dim:#5d6877;
    --accent:#b8f34a; --accent-ink:#101408; --danger:#ff6f6f;
    --row:32px;
    --zoom-scale:1;
    --row-number-width:56px;
    --sheet:#ffffff; --sheet-ink:#202833; --sheet-muted:#75808d;
    --sheet-head:#f3f5f7; --sheet-line:#dfe4e8; --sheet-hover:#f1f8e8;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  button{font:inherit; cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .top{
    display:flex; align-items:center; gap:16px; padding:12px 18px;
    background:linear-gradient(180deg,#121821,#0e131a); border-bottom:1px solid var(--line);
    flex:0 0 auto; z-index:10;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px; white-space:nowrap}
  .mark{
    width:12px; height:12px; border-radius:3px; background:var(--accent);
    box-shadow:0 0 14px rgba(184,243,74,.55);
  }
  .meta{color:var(--muted); font-size:12.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
  .actions{display:flex; gap:8px; flex:0 0 auto}
  .btn{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    padding:8px 13px; border-radius:9px; font-size:13px; transition:background .15s,border-color .15s;
  }
  .btn:hover:not(:disabled){background:#1d2531; border-color:#313c4c}
  .btn:disabled{opacity:.38; cursor:default}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:700}
  .btn.primary:hover{background:#c8ff62}
  .btn.ghost{background:transparent}
  main{flex:1; min-height:0; display:flex; flex-direction:column; position:relative}
  .empty{
    flex:1; display:grid; place-items:center; padding:28px;
    background:radial-gradient(700px 380px at 50% 18%, rgba(184,243,74,.06), transparent 70%);
  }
  .card{
    width:min(620px,100%); text-align:center; padding:44px 30px 34px;
    border:1.5px dashed #2c3645; border-radius:18px; background:rgba(17,22,30,.72);
  }
  .card svg{width:64px; height:64px; color:var(--accent); opacity:.9}
  .card h1{font-size:clamp(22px,3vw,30px); margin:16px 0 6px; letter-spacing:-.3px}
  .card p{margin:0 0 22px; color:var(--muted)}
  .card .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  .card small{display:block; margin-top:22px; color:var(--dim); font-size:12px}
  .viewer{flex:1; min-height:0; display:flex; flex-direction:column}
  .tabbar{
    display:flex; gap:4px; padding:8px 12px 0; overflow-x:auto; overflow-y:hidden;
    background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
    scrollbar-width:thin;
  }
  .tab{
    border:1px solid transparent; border-bottom:0; background:transparent; color:var(--muted);
    padding:8px 14px; border-radius:9px 9px 0 0; white-space:nowrap; font-size:13px;
  }
  .tab:hover{color:var(--text); background:#161c26}
  .tab.active{background:var(--bg); color:var(--text); border-color:var(--line); box-shadow:inset 0 2px 0 var(--accent)}
  .tab .hidden-dot{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--dim); margin-left:6px; vertical-align:middle}
  .toolbar{
    display:flex; align-items:center; gap:9px; padding:8px 14px;
    background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  .search{
    flex:1; min-width:120px; max-width:560px; background:#0d1219; border:1px solid var(--line);
    color:var(--text); border-radius:9px; padding:8px 12px; font-size:13px;
  }
  .search::placeholder{color:var(--dim)}
  .stats{color:var(--muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-left:auto}
  .gridwrap{flex:1; min-height:0; overflow:auto; position:relative; background:var(--sheet); scrollbar-color:#aeb7c1 #eef1f4}
  .inspect{display:flex; align-items:center; justify-content:flex-start; text-align:left; gap:12px; padding:7px 14px; background:var(--panel); border-top:1px solid var(--line); flex:0 0 auto; min-height:52px}
  .inspect .addr{color:var(--accent); font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace; min-width:54px}
  .inspect .val{flex:1; min-width:0; max-height:58px; color:var(--text); text-align:left; font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; white-space:pre-wrap; overflow:auto; overflow-wrap:anywhere; scrollbar-width:thin}
  .inspect .val.placeholder{color:var(--dim); font-style:italic; font-family:inherit}
  .inspect .btn{padding:5px 10px; font-size:12px}
  .formula{color:#1769aa; font-style:italic}
  .busy{position:fixed; inset:0; z-index:70; display:none; place-items:center; background:rgba(8,11,16,.78); backdrop-filter:blur(2px)}
  .busy.on{display:grid}
  .busy .box{display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line); padding:16px 22px; border-radius:12px; font-size:13px}
  .spinner{width:30px; height:30px; border:3px solid #2c3645; border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  table{border-collapse:separate; border-spacing:0; table-layout:fixed; width:max-content; font-size:calc(13px * var(--zoom-scale)); color:var(--sheet-ink)}
  thead th{
    position:sticky; top:0; z-index:2; height:calc(36px * var(--zoom-scale)); padding:0 calc(10px * var(--zoom-scale)); text-align:center;
    background:var(--sheet-head); color:#505b67; font-size:calc(11.5px * var(--zoom-scale)); font-weight:650; letter-spacing:.2px;
    border-bottom:calc(1px * var(--zoom-scale)) solid #cfd6dd; border-right:calc(1px * var(--zoom-scale)) solid var(--sheet-line); white-space:nowrap;
  }
  tbody td{
    height:var(--row); padding:0 calc(10px * var(--zoom-scale)); line-height:normal;
    border-bottom:calc(1px * var(--zoom-scale)) solid var(--sheet-line); border-right:calc(1px * var(--zoom-scale)) solid var(--sheet-line);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle; background:var(--sheet);
  }
  tbody tr:hover td{background:var(--sheet-hover)}
  td.num{text-align:right; font-variant-numeric:tabular-nums}
  td.rownum,th.rownum{
    position:sticky; left:0; width:var(--row-number-width); min-width:var(--row-number-width); max-width:var(--row-number-width); text-align:right;
    padding:0 calc(9px * var(--zoom-scale)) 0 calc(4px * var(--zoom-scale)); color:#7c8793; background:#f4f6f8; font-size:calc(11px * var(--zoom-scale));
    font-variant-numeric:tabular-nums; border-right:calc(1px * var(--zoom-scale)) solid #cfd6dd; z-index:1;
  }
  th.rownum{z-index:3; background:#e9edf1; color:#65717e}
  tbody tr:hover td.rownum{background:#e8f1dc}
  td.cell-with-image{position:relative;padding:0!important;background:#fff!important}
  td.cell-with-image .cell-image{position:absolute;inset:calc(2px * var(--zoom-scale));width:calc(100% - 4px * var(--zoom-scale));height:calc(100% - 4px * var(--zoom-scale));object-fit:contain;background:#fff;cursor:zoom-in}
  td.cell-with-image.selected .cell-image{inset:calc(3px * var(--zoom-scale));width:calc(100% - 6px * var(--zoom-scale));height:calc(100% - 6px * var(--zoom-scale))}
  td.cell-with-image .cell-image-fallback{position:absolute;inset:2px;display:grid;place-items:center;padding:4px;color:#697583;background:#f4f6f8;font-size:11px;text-align:center;cursor:zoom-in}
  .cell-image:focus-visible,.cell-image-fallback:focus-visible{outline:2px solid #70a92a;outline-offset:-2px}
  td.selected{position:relative; z-index:1; outline:2px solid #70a92a; outline-offset:-2px; background:#f7ffed!important}
  td.rownum.selected-row{background:#e5f0d7; color:#3d6416; font-weight:700}
  .cell-text{display:block; overflow:hidden; text-overflow:ellipsis; white-space:inherit}
  .wrap-text tbody td{white-space:normal; line-height:1.25; padding-top:calc(5px * var(--zoom-scale)); padding-bottom:calc(5px * var(--zoom-scale))}
  .wrap-text .cell-text{display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; white-space:normal; overflow-wrap:anywhere}
  tbody td.excel-wrap{white-space:normal; line-height:1.25; padding-top:calc(5px * var(--zoom-scale)); padding-bottom:calc(5px * var(--zoom-scale))}
  tbody td.excel-wrap .cell-text{display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; white-space:normal; overflow-wrap:anywhere}
  .visual-layer{position:absolute;left:0;top:0;z-index:4;pointer-events:none}
  .visual-object{position:absolute;display:block;overflow:hidden;pointer-events:auto;border:1px solid #c8d0d8;border-radius:5px;background:#fff;box-shadow:0 3px 10px rgba(22,34,46,.22);cursor:zoom-in}
  .visual-object img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
  .visual-object .chart-svg{display:block;width:100%;height:100%;background:#fff}
  .visual-object .object-label{position:absolute;left:0;right:0;bottom:0;padding:3px 7px;background:rgba(17,26,36,.82);color:#fff;font-size:10px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:0;transition:opacity .15s}
  .visual-object:hover .object-label,.visual-object:focus-visible .object-label{opacity:1}
  .visual-object.unsupported{display:grid;place-content:center;gap:4px;padding:12px;text-align:center;color:#52606e;background:#f7f9fb;font-size:12px;cursor:zoom-in}
  .visual-object.unsupported strong{font-size:13px;color:#283542}
  .visual-layer.off{display:none}
  .visual-dialog{width:min(1000px,94vw);height:min(760px,90vh);padding:0;border:1px solid #374353;border-radius:14px;background:#11161e;color:#e8edf3;box-shadow:0 24px 80px rgba(0,0,0,.55)}
  .visual-dialog::backdrop{background:rgba(4,7,11,.76);backdrop-filter:blur(3px)}
  .visual-dialog-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #293241}
  .visual-dialog-head strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .visual-dialog-body{height:calc(100% - 52px);display:grid;place-items:center;padding:18px;overflow:auto}
  .visual-dialog-body img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:5px}
  .visual-dialog-body .chart-svg{width:100%;height:100%;min-height:320px;background:#fff;border-radius:5px}
  .visual-dialog-body .unsupported{max-width:500px;text-align:center;color:#aab4c0;line-height:1.6}
  .toolbar .btn{padding:7px 10px; white-space:nowrap}
  .toolbar .btn[aria-pressed="true"]{border-color:#718b4a; color:#d8f6a4; background:#202b1b}
  .zoom-controls{display:flex;align-items:center;gap:3px;flex:0 0 auto;padding:2px;border:1px solid var(--line);border-radius:9px;background:#0d1219}
  .zoom-controls .btn{min-width:34px;padding:5px 8px;border:0;background:transparent}
  .zoom-controls .zoom-value{min-width:48px;color:var(--muted);font-variant-numeric:tabular-nums}
  .zoom-controls .btn:hover:not(:disabled){background:#1d2531}
  tr.spacer td{padding:0!important; border:0!important; line-height:0!important; background:transparent!important}
  .emptycell{color:var(--sheet-muted); text-align:center; padding:30px!important; line-height:1.6!important}
  mark{background:var(--accent); color:var(--accent-ink); border-radius:2px; padding:0 1px}
  .veil{
    position:fixed; inset:0; z-index:50; display:none; place-items:center; pointer-events:none;
    background:rgba(8,11,16,.72); backdrop-filter:blur(3px);
  }
  .veil.on{display:grid}
  .veil div{
    border:2px dashed var(--accent); border-radius:16px; padding:26px 40px;
    font-size:18px; font-weight:700; color:var(--accent); background:rgba(11,14,19,.8);
  }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(10px);
    background:#1a212c; color:var(--text); border:1px solid #2c3645; border-radius:10px;
    padding:10px 16px; font-size:13px; box-shadow:0 12px 34px rgba(0,0,0,.45);
    opacity:0; pointer-events:none; transition:opacity .18s,transform .18s; max-width:min(560px,90vw); z-index:60;
  }
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:#5a2b2b; color:#ffd9d9}
  @media (max-width:720px){
    .meta{display:none}
    .top{padding:10px 12px; gap:10px}
    .card{padding:32px 18px}
    .toolbar{gap:6px; flex-wrap:wrap}
    .toolbar .search{max-width:none; flex-basis:100%}
    .toolbar .btn{font-size:12px; padding:6px 8px}
    .zoom-controls .btn{font-size:12px;padding:5px 7px}
    .stats{margin-left:auto; max-width:100%}
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"></span><span>Voryda Sheet</span></div>
  <div class="meta" id="meta">Local · los archivos no salen de tu equipo</div>
  <div class="actions">
    <button class="btn" id="openBtn">Abrir archivo</button>
    <button class="btn ghost" id="csvBtn" disabled>Exportar CSV</button>
  </div>
  <input id="fileInput" type="file" accept=".xlsx,.xlsm,.xls,.csv" hidden>
</header>

<main>
  <section class="empty" id="empty">
    <div class="card">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="8" y="10" width="48" height="44" rx="5"/>
        <path d="M8 24h48M24 24v30M40 24v30M8 38h48"/>
      </svg>
      <h1>Arrastra tu Excel aquí</h1>
      <p>.xlsx · .xlsm · .xls · .csv</p>
      <div class="row">
        <button class="btn primary" id="pickBtn">Elegir archivo</button>
        <button class="btn ghost" id="demoBtn">Ver ejemplo</button>
      </div>
      <small>Todo se procesa en tu navegador. Nada se envía a ningún servidor.</small>
    </div>
  </section>

  <section class="viewer" id="viewer" hidden>
    <div class="tabbar" id="tabs" role="tablist" aria-label="Hojas"></div>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Buscar en la hoja…" aria-label="Buscar en la hoja">
      <button class="btn ghost" id="wrapBtn" type="button" aria-pressed="false" title="Mostrar hasta dos líneas por celda">Ajustar texto</button>
      <button class="btn ghost" id="fitBtn" type="button" title="Usar los anchos estimados según el contenido">Ajustar columnas</button>
      <button class="btn ghost" id="visualBtn" type="button" aria-pressed="true" hidden>Visuales</button>
      <div class="zoom-controls" role="group" aria-label="Zoom de la hoja">
        <button class="btn" id="zoomOut" type="button" aria-label="Reducir zoom" title="Reducir zoom">−</button>
        <button class="btn zoom-value" id="zoomReset" type="button" title="Restablecer zoom">100%</button>
        <button class="btn" id="zoomIn" type="button" aria-label="Aumentar zoom" title="Aumentar zoom">+</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="gridwrap" id="gridwrap">
      <table id="grid" aria-label="Contenido de la hoja">
        <colgroup id="cols"></colgroup>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="visual-layer" id="visualLayer" aria-label="Imágenes y gráficos de la hoja"></div>
    </div>
    <div class="inspect" id="inspect">
      <span class="addr" id="cellAddr">—</span>
      <span class="val placeholder" id="cellVal">Haz clic en una celda para ver su contenido completo</span>
      <button class="btn ghost" id="copyCell" disabled>Copiar</button>
    </div>
  </section>
</main>

<div class="veil" id="veil"><div>Suelta el archivo para abrirlo</div></div>
<div class="busy" id="busy"><div class="box"><div class="spinner"></div><div id="busyText">Leyendo…</div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog class="visual-dialog" id="visualDialog" aria-label="Vista ampliada del objeto">
  <div class="visual-dialog-head"><strong id="visualDialogTitle">Vista previa</strong><button class="btn ghost" id="closeVisualDialog" type="button">Cerrar</button></div>
  <div class="visual-dialog-body" id="visualDialogBody"></div>
</dialog>

<script src="vendor/xlsx.full.min.js"></script>
<script src="visuals.js"></script>
<script>
(() => {
  'use strict';
  const ROW_H = 32;
  const HEADER_H = 36;
  const ROW_NUMBER_W = 56;
  const MAX_OOXML_FEATURE_SIZE = 64 * 1024 * 1024;
  const WRAP_ROW_H = 52;
  const OVERSCAN = 8;
  const $ = (id) => document.getElementById(id);
  const fmt = new Intl.NumberFormat('es-ES');

  const state = {
    wb: null, name: '', active: 0,
    rows: [], totalRows: 0, totalCols: 0, rowStart: 0, colStart: 0, ws: null,
    formulas: new Map(), cellValue: '',
    filtered: null, query: '', searchText: null,
    widths: [], visibleCols: [], rowHeights: [], viewRows: [], visibleRows: [], viewOffsets: [0],
    useExcelWidths: true, wrapText: false, zoom:100, selectedAddr: '', selectedRow: null,
    cellStylesBySheet: new Map(), cellStyles: new Map(),
    visualsBySheet: new Map(), visuals: [], cellImagesBySheet:new Map(), cellImages:new Map(), visualUrls:[], showVisuals: true,
    renderedStart: -1, renderedCount: 0, scrollRaf: false
  };

  let toastTimer = null;
  function toast(message, isError) {
    const el = $('toast');
    el.textContent = message;
    el.classList.toggle('err', !!isError);
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('on'), isError ? 6500 : 2600);
  }

  function setBusy(on, text) {
    const el = $('busy');
    el.classList.toggle('on', !!on);
    if (text) $('busyText').textContent = text;
  }

  function clearVisualUrls(urls) {
    for (const url of urls || []) {
      try { URL.revokeObjectURL(url); } catch (_) { /* Already released. */ }
    }
  }

  function showCell(addr, value, placeholder) {
    state.cellValue = value || '';
    $('cellAddr').textContent = addr || '—';
    const out = $('cellVal');
    out.textContent = placeholder ? 'Haz clic en una celda para ver su contenido completo' : (value || '(celda vacía)');
    out.classList.toggle('placeholder', !!placeholder || !value);
    out.title = value || '';
    $('copyCell').disabled = !value;
  }

  function esc(value) {
    return String(value).replace(/[&<>"']/g, (c) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function highlight(value) {
    const text = String(value);
    const q = state.query;
    if (!q) return esc(text);
    const low = text.toLowerCase();
    let out = '', i = 0;
    while (true) {
      const p = low.indexOf(q, i);
      if (p < 0) { out += esc(text.slice(i)); break; }
      out += esc(text.slice(i, p)) + '<mark>' + esc(text.slice(p, p + q.length)) + '</mark>';
      i = p + q.length;
    }
    return out;
  }

  function isNumeric(text) {
    return /^[\s]*[-+]?[\d.,]+(?:[eE][-+]?\d+)?\s*(?:%|€|\$)?\s*$/.test(text) && /\d/.test(text);
  }

  function colName(index) {
    let n = index, out = '';
    while (n >= 0) { out = String.fromCharCode(65 + (n % 26)) + out; n = Math.floor(n / 26) - 1; }
    return out;
  }

  function workbookFileText(wb, path) {
    const file = wb.files && wb.files[path];
    if (!file || !file.content) return '';
    return typeof file.content === 'string' ? file.content : new TextDecoder('utf-8').decode(file.content);
  }

  function xmlAttribute(attributes, name) {
    const match = attributes.match(new RegExp(`(?:^|\\s)${name}\\s*=\\s*(?:"([^"]*)"|'([^']*)')`, 'i'));
    return match ? (match[1] == null ? match[2] : match[1]) : '';
  }

  function workbookTargetPath(target) {
    if (!target || /^[a-z]+:/i.test(target)) return '';
    const parts = (target[0] === '/' ? target.slice(1) : 'xl/' + target).split('/');
    const normalized = [];
    for (const part of parts) {
      if (!part || part === '.') continue;
      if (part === '..') normalized.pop();
      else normalized.push(part);
    }
    return normalized.join('/');
  }

  function excelColor(color, wb) {
    if (!color) return '';
    let rgb = color.rgb || color.argb || color.lastClr || '';
    if (!rgb && color.theme != null) {
      const scheme = wb.Themes && wb.Themes.themeElements && wb.Themes.themeElements.clrScheme;
      const theme = scheme && scheme[Number(color.theme)];
      rgb = theme && (theme.rgb || theme.lastClr || '');
    }
    if (!rgb && color.indexed != null) {
      const palette = ['000000','FFFFFF','FF0000','00FF00','0000FF','FFFF00','FF00FF','00FFFF'];
      rgb = palette[Number(color.indexed)] || '';
    }
    rgb = String(rgb).replace(/^#/, '').slice(-6);
    if (!/^[0-9a-f]{6}$/i.test(rgb)) return '';
    let channels = [0, 2, 4].map((i) => parseInt(rgb.slice(i, i + 2), 16));
    const tint = Number(color.tint);
    if (Number.isFinite(tint) && tint !== 0) {
      channels = channels.map((value) => Math.round(tint < 0 ? value * (1 + tint) : value * (1 - tint) + 255 * tint));
    }
    return '#' + channels.map((value) => value.toString(16).padStart(2, '0')).join('');
  }

  function flag(value) {
    return value === true || value === 1 || value === '1' || value === 'true';
  }

  function borderCss(side, wb) {
    if (!side || !side.style) return '';
    const styles = {
      hair: '1px dotted', thin: '1px solid', dotted: '1px dotted', dashed: '1px dashed',
      dashDot: '1px dashed', dashDotDot: '1px dashed', medium: '2px solid',
      mediumDashed: '2px dashed', mediumDashDot: '2px dashed', mediumDashDotDot: '2px dashed',
      thick: '3px solid', double: '3px double', slantDashDot: '1px dashed'
    };
    const definition = styles[side.style];
    if (!definition) return '';
    return definition + ' ' + (excelColor(side.color, wb) || '#9aa4af');
  }

  function cssFromCellFormat(xf, tables, wb) {
    if (!xf) return null;
    const css = {};
    const font = tables.Fonts[Number(xf.fontId)] || {};
    const fill = tables.Fills[Number(xf.fillId)] || {};
    const border = tables.Borders[Number(xf.borderId)] || {};
    const alignment = xf.alignment || {};
    if (fill.patternType === 'solid') {
      const color = excelColor(fill.fgColor || fill.bgColor, wb);
      if (color) css.backgroundColor = color;
    }
    const fontColor = excelColor(font.color, wb);
    if (fontColor) css.color = fontColor;
    if (flag(font.bold)) css.fontWeight = '700';
    if (flag(font.italic)) css.fontStyle = 'italic';
    const decorations = [];
    if (font.underline) decorations.push('underline');
    if (flag(font.strike)) decorations.push('line-through');
    if (decorations.length) css.textDecoration = decorations.join(' ');
    if (font.name) {
      const family = String(font.name).replace(/[^a-z0-9 _,-]/gi, '').trim();
      if (family) css.fontFamily = '"' + family + '", Arial, sans-serif';
    }
    const size = Number(font.sz);
    if (Number.isFinite(size) && size > 0) css.fontSize = Math.max(8, Math.min(36, size)) + 'px';
    const horizontal = { left:'left', center:'center', right:'right', justify:'justify', distributed:'justify', centerContinuous:'center' }[alignment.horizontal];
    const vertical = { top:'top', center:'middle', bottom:'bottom' }[alignment.vertical];
    if (horizontal) css.textAlign = horizontal;
    if (vertical) css.verticalAlign = vertical;
    const indent = Math.max(0, Math.min(15, Number(alignment.indent) || 0));
    if (indent) css.paddingLeft = (10 + indent * 8) + 'px';
    for (const [sideName, cssName] of [['left','borderLeft'], ['right','borderRight'], ['top','borderTop'], ['bottom','borderBottom']]) {
      const value = borderCss(border[sideName], wb);
      if (value) css[cssName] = value;
    }
    if (!Object.keys(css).length && !flag(alignment.wrapText)) return null;
    css.wrapText = flag(alignment.wrapText);
    return css;
  }

  function cssFromCellObject(style, wb) {
    if (!style) return null;
    const css = {};
    if (style.patternType === 'solid') {
      const color = excelColor(style.fgColor || style.bgColor, wb);
      if (color) css.backgroundColor = color;
    }
    const color = excelColor(style.color, wb);
    if (color) css.color = color;
    if (style.font) {
      if (flag(style.font.bold)) css.fontWeight = '700';
      if (flag(style.font.italic)) css.fontStyle = 'italic';
      const fontColor = excelColor(style.font.color, wb);
      if (fontColor) css.color = fontColor;
      const size = Number(style.font.sz);
      if (Number.isFinite(size) && size > 0) css.fontSize = Math.max(8, Math.min(36, size)) + 'px';
      if (style.font.name) {
        const family = String(style.font.name).replace(/[^a-z0-9 _,-]/gi, '').trim();
        if (family) css.fontFamily = '"' + family + '", Arial, sans-serif';
      }
    }
    const alignment = style.alignment || {};
    const horizontal = { left:'left', center:'center', right:'right', justify:'justify' }[alignment.horizontal];
    const vertical = { top:'top', center:'middle', bottom:'bottom' }[alignment.vertical];
    if (horizontal) css.textAlign = horizontal;
    if (vertical) css.verticalAlign = vertical;
    if (alignment.wrapText) css.wrapText = flag(alignment.wrapText);
    for (const [sideName, cssName] of [['left','borderLeft'], ['right','borderRight'], ['top','borderTop'], ['bottom','borderBottom']]) {
      const value = borderCss(style.border && style.border[sideName], wb);
      if (value) css[cssName] = value;
    }
    if (!Object.keys(css).length && !flag(alignment.wrapText)) return null;
    css.wrapText = flag(alignment.wrapText);
    return css;
  }

  function readXlsxCellStyles(wb) {
    const result = new Map();
    const relationshipXml = workbookFileText(wb, 'xl/_rels/workbook.xml.rels');
    if (!relationshipXml || !wb.Styles) return result;
    const relationships = new Map();
    const relationshipPattern = /<Relationship\b([^>]*?)\/?\s*>/g;
    let match;
    while ((match = relationshipPattern.exec(relationshipXml))) {
      const attributes = match[1];
      const id = xmlAttribute(attributes, 'Id') || xmlAttribute(attributes, 'id');
      const target = xmlAttribute(attributes, 'Target') || xmlAttribute(attributes, 'target');
      const mode = xmlAttribute(attributes, 'TargetMode') || xmlAttribute(attributes, 'targetMode');
      if (id && target && mode !== 'External') relationships.set(id, workbookTargetPath(target));
    }
    const tables = {
      Fonts: wb.Styles.Fonts || [], Fills: wb.Styles.Fills || [],
      Borders: wb.Styles.Borders || [], CellXf: wb.Styles.CellXf || []
    };
    const byStyleId = new Map();
    const sheets = wb.Workbook && wb.Workbook.Sheets ? wb.Workbook.Sheets : [];
    for (const sheet of sheets) {
      const path = relationships.get(sheet.id);
      const xml = workbookFileText(wb, path);
      if (!xml) continue;
      const cellStyles = new Map();
      const cellPattern = /<c\b([^>]*)>/g;
      while ((match = cellPattern.exec(xml))) {
        const attributes = match[1];
        const styleId = Number(xmlAttribute(attributes, 's'));
        if (!Number.isInteger(styleId) || styleId <= 0) continue;
        const address = xmlAttribute(attributes, 'r');
        if (!address) continue;
        let style = byStyleId.get(styleId);
        if (style === undefined) {
          style = cssFromCellFormat(tables.CellXf[styleId], tables, wb);
          byStyleId.set(styleId, style || null);
        }
        if (style) {
          const decoded = XLSX.utils.decode_cell(address);
          cellStyles.set(decoded.r + ',' + decoded.c, style);
        }
      }
      if (cellStyles.size) result.set(sheet.name, cellStyles);
    }
    return result;
  }

  function applyCellStyle(cell, style) {
    if (!style) return;
    const css = {};
    for (const key of Object.keys(style)) if (key !== 'wrapText') css[key] = style[key];
    Object.assign(cell.style, css);
    if (style.wrapText) cell.classList.add('excel-wrap');
  }

  function rowHeight(index) {
    const height = state.rowHeights[index] || ROW_H;
    return (state.wrapText ? Math.max(height, WRAP_ROW_H) : height) * (state.zoom / 100);
  }

  function rebuildVisibleRows() {
    state.visibleRows = state.filtered || state.viewRows;
    const offsets = new Array(state.visibleRows.length + 1);
    offsets[0] = 0;
    for (let i = 0; i < state.visibleRows.length; i++) {
      offsets[i + 1] = offsets[i] + rowHeight(state.visibleRows[i]);
    }
    state.viewOffsets = offsets;
  }

  function findRowAt(offset) {
    const offsets = state.viewOffsets;
    let low = 0, high = Math.max(0, offsets.length - 1);
    while (low < high) {
      const mid = Math.ceil((low + high) / 2);
      if (offsets[mid] <= offset) low = mid;
      else high = mid - 1;
    }
    return Math.min(low, Math.max(0, state.visibleRows.length - 1));
  }

  function buildTabs() {
    const bar = $('tabs');
    bar.replaceChildren();
    state.wb.SheetNames.forEach((name, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (i === state.active ? ' active' : '');
      btn.type = 'button';
      btn.role = 'tab';
      btn.setAttribute('aria-selected', i === state.active ? 'true' : 'false');
      btn.textContent = name;
      const hidden = state.wb.Workbook && state.wb.Workbook.Sheets && state.wb.Workbook.Sheets[i] && state.wb.Workbook.Sheets[i].Hidden;
      if (hidden) {
        const dot = document.createElement('span');
        dot.className = 'hidden-dot';
        dot.title = 'Hoja oculta';
        btn.appendChild(dot);
      }
      btn.addEventListener('click', () => selectSheet(i));
      bar.appendChild(btn);
    });
  }

  function measureColumns(useExcelWidths) {
    const widths = [];
    const visibleCols = [];
    const metadata = state.ws && state.ws['!cols'] ? state.ws['!cols'] : [];
    const sampleRows = Math.min(state.rows.length, 500);
    for (let c = 0; c < state.totalCols; c++) {
      const column = metadata[state.colStart + c] || {};
      if (column.hidden) continue;
      let width = 0;
      if (useExcelWidths) {
        if (Number.isFinite(column.wpx) && column.wpx > 0) width = column.wpx;
        else if (Number.isFinite(column.wch) && column.wch > 0) width = Math.round(column.wch * 7 + 12);
      }
      if (!width) {
        let longest = 7;
        for (let r = 0; r < sampleRows; r++) {
          const row = state.rows[r];
          if (!row) continue;
          const len = String(row[c] == null ? '' : row[c]).length;
          if (len > longest) longest = len;
        }
        width = Math.round(longest * 7.2 + 26);
      }
      widths[c] = Math.max(52, Math.min(520, Math.round(width)));
      visibleCols.push(c);
    }
    state.widths = widths;
    state.visibleCols = visibleCols;
  }

  function renderHeader() {
    const tr = document.createElement('tr');
    const corner = document.createElement('th');
    corner.className = 'rownum';
    corner.textContent = '#';
    tr.appendChild(corner);
    for (const c of state.visibleCols) {
      const th = document.createElement('th');
      th.textContent = colName(state.colStart + c);
      th.style.width = (state.widths[c] * state.zoom / 100) + 'px';
      th.title = 'Columna ' + colName(state.colStart + c);
      tr.appendChild(th);
    }
    $('thead').replaceChildren(tr);

    const cols = document.createDocumentFragment();
    const first = document.createElement('col');
    first.style.width = (ROW_NUMBER_W * state.zoom / 100) + 'px';
    cols.appendChild(first);
    for (const c of state.visibleCols) {
      const col = document.createElement('col');
      col.style.width = (state.widths[c] * state.zoom / 100) + 'px';
      cols.appendChild(col);
    }
    $('cols').replaceChildren(cols);
  }

  function renderStats() {
    const parts = [];
    parts.push(fmt.format(state.viewRows.length) + ' filas × ' + fmt.format(state.visibleCols.length) + ' columnas');
    parts.push('Hoja ' + (state.active + 1) + '/' + state.wb.SheetNames.length);
    const visualCount = state.visuals.length + state.cellImages.size;
    if (visualCount) parts.push(fmt.format(visualCount) + (visualCount === 1 ? ' objeto visual' : ' objetos visuales'));
    if (state.query) parts.push(fmt.format(state.filtered ? state.filtered.length : 0) + ' coincidencias');
    $('stats').textContent = parts.join(' · ');
  }

  function spacerRow(height, colspan) {
    const tr = document.createElement('tr');
    tr.className = 'spacer';
    const td = document.createElement('td');
    td.colSpan = colspan;
    td.style.height = Math.max(0, height) + 'px';
    tr.appendChild(td);
    return tr;
  }

  function buildRow(index) {
    const tr = document.createElement('tr');
    const height = rowHeight(index);
    tr.style.height = height + 'px';
    const num = document.createElement('td');
    num.className = 'rownum';
    num.textContent = fmt.format(state.rowStart + index + 1);
    if (state.selectedRow === index) num.classList.add('selected-row');
    tr.appendChild(num);
    const row = state.rows[index] || [];
    for (const c of state.visibleCols) {
      const td = document.createElement('td');
      td.style.height = height + 'px';
      const raw = row[c] == null ? '' : String(row[c]);
      const absolute = (state.rowStart + index) + ',' + (state.colStart + c);
      const formula = state.formulas.get(absolute);
      const display = raw || (formula ? formula : '');
      const cellObject = state.ws[XLSX.utils.encode_cell({ r: state.rowStart + index, c: state.colStart + c })];
      applyCellStyle(td, state.cellStyles.get(absolute) || cssFromCellObject(cellObject && cellObject.s, state.wb));
      if (display.length > 80) td.title = display.slice(0, 600) + (display.length > 600 ? '…' : '');
      const cellImage = state.cellImages.get(absolute);
      if (cellImage && state.showVisuals) {
        td.classList.add('cell-with-image');
        td.title = cellImage.message || cellImage.alt || cellImage.name;
        const image = document.createElement(cellImage.kind === 'image' ? 'img' : 'span');
        image.className = cellImage.kind === 'image' ? 'cell-image' : 'cell-image-fallback';
        if (cellImage.kind === 'image') {
          image.src = cellImage.src;
          image.alt = cellImage.alt || cellImage.name || 'Imagen en la celda';
        } else image.textContent = 'Imagen no compatible';
        image.tabIndex = 0;
        image.setAttribute('role', 'button');
        image.setAttribute('aria-label', (cellImage.alt || cellImage.name || 'Imagen de Excel') + ' · abrir ampliada');
        image.addEventListener('click', () => openVisual(cellImage));
        image.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openVisual(cellImage);
          }
        });
        td.appendChild(image);
      } else {
        td.innerHTML = '<span class="cell-text">' + (formula && !raw
          ? '<span class="formula">' + esc(display) + '</span>'
          : highlight(display)) + '</span>';
      }
      if (isNumeric(raw)) td.classList.add('num');
      td.dataset.addr = colName(state.colStart + c) + (state.rowStart + index + 1);
      if (td.dataset.addr === state.selectedAddr) td.classList.add('selected');
      td.dataset.row = String(index);
      td.dataset.col = String(c);
      tr.appendChild(td);
    }
    return tr;
  }

  function renderBody(force) {
    const wrap = $('gridwrap');
    const total = state.visibleRows.length;
    const tbody = $('tbody');
    if (!state.rows.length || !state.visibleCols.length || !total) {
      const message = state.query && !total ? 'No hay coincidencias.'
        : (state.rows.length && !state.visibleCols.length ? 'Todas las columnas están ocultas.' : 'Esta hoja está vacía.');
      tbody.innerHTML = '<tr><td class="emptycell" colspan="' + (state.visibleCols.length + 1) + '">' + message + '</td></tr>';
      return;
    }
    const viewport = Math.max(120, wrap.clientHeight);
    const first = findRowAt(wrap.scrollTop);
    const start = Math.max(0, first - OVERSCAN);
    const last = Math.min(total, findRowAt(wrap.scrollTop + viewport) + OVERSCAN + 1);
    const count = Math.max(1, last - start);
    if (!force && start === state.renderedStart && count === state.renderedCount) return;
    state.renderedStart = start;
    state.renderedCount = count;

    const frag = document.createDocumentFragment();
    if (start > 0) frag.appendChild(spacerRow(state.viewOffsets[start], state.visibleCols.length + 1));
    for (let k = 0; k < count; k++) {
      const rowIndex = state.visibleRows[start + k];
      frag.appendChild(buildRow(rowIndex));
    }
    const renderedEnd = Math.min(total, start + count);
    const bottom = state.viewOffsets[total] - state.viewOffsets[renderedEnd];
    if (bottom > 0) frag.appendChild(spacerRow(bottom, state.visibleCols.length + 1));
    tbody.replaceChildren(frag);
  }

  function visualColumnPosition(column, offsetEmu) {
    const scale = state.zoom / 100;
    let x = ROW_NUMBER_W * scale;
    for (const index of state.visibleCols) {
      const absoluteColumn = state.colStart + index;
      if (absoluteColumn < column) x += (state.widths[index] || 76) * scale;
      else if (absoluteColumn === column) return x + (offsetEmu || 0) / 9525 * scale;
      else return x;
    }
    const lastColumn = state.colStart + state.totalCols;
    if (column > lastColumn) {
      const metadata = state.ws && state.ws['!cols'] || [];
      for (let current = lastColumn; current < column; current++) {
        const columnMetadata = metadata[current] || {};
        if (columnMetadata.hidden) continue;
        const width = Number.isFinite(columnMetadata.wpx) && columnMetadata.wpx > 0
          ? columnMetadata.wpx
          : (Number.isFinite(columnMetadata.wch) && columnMetadata.wch > 0 ? columnMetadata.wch * 7 + 12 : 64);
        x += width * scale;
      }
    }
    return x + (offsetEmu || 0) / 9525 * scale;
  }

  function visualRowPosition(row, offsetEmu) {
    const scale = state.zoom / 100;
    let y = HEADER_H * scale;
    for (const index of state.viewRows) {
      const absoluteRow = state.rowStart + index;
      if (absoluteRow < row) y += rowHeight(index);
      else if (absoluteRow === row) return y + (offsetEmu || 0) / 9525 * scale;
      else return y;
    }
    const lastRow = state.rowStart + state.rows.length;
    if (row > lastRow) {
      const metadata = state.ws && state.ws['!rows'] || [];
      for (let current = lastRow; current < row; current++) {
        const rowMetadata = metadata[current] || {};
        if (rowMetadata.hidden || rowMetadata.hpx === 0 || rowMetadata.hpt === 0) continue;
        const height = Number.isFinite(rowMetadata.hpx) ? rowMetadata.hpx
          : (Number.isFinite(rowMetadata.hpt) ? rowMetadata.hpt * 96 / 72 : ROW_H);
        y += height * scale;
      }
    }
    return y + (offsetEmu || 0) / 9525 * scale;
  }

  function visualBounds(item) {
    const anchor = item.anchor || {};
    const scale = state.zoom / 100;
    if (anchor.absolute) return { x:ROW_NUMBER_W * scale + anchor.x * scale, y:HEADER_H * scale + anchor.y * scale, width:anchor.width * scale, height:anchor.height * scale };
    const from = anchor.from || { col:0, row:0, colOff:0, rowOff:0 };
    const x = visualColumnPosition(from.col, from.colOff);
    const y = visualRowPosition(from.row, from.rowOff);
    let width = (anchor.width || 0) * scale, height = (anchor.height || 0) * scale;
    if (anchor.to) {
      const endX = visualColumnPosition(anchor.to.col, anchor.to.colOff);
      const endY = visualRowPosition(anchor.to.row, anchor.to.rowOff);
      if (endX > x) width = endX - x;
      if (endY > y) height = endY - y;
    }
    if (item.kind === 'chart') {
      width = Math.max(220 * scale, width || 520 * scale);
      height = Math.max(170 * scale, height || 320 * scale);
    } else if (item.kind === 'text') {
      width = Math.max(150 * scale, width || 220 * scale);
      height = Math.max(58 * scale, height || 90 * scale);
    } else {
      width = width || 240 * scale;
      height = height || 180 * scale;
    }
    return {
      x:Math.max(0, x), y:Math.max(HEADER_H * scale, y),
      width:Math.max(40 * scale, Math.min(1600 * scale, width)), height:Math.max(36 * scale, Math.min(1200 * scale, height))
    };
  }

  function renderVisuals() {
    const layer = $('visualLayer');
    const button = $('visualBtn');
    const items = state.visuals || [];
    const visualCount = items.length + state.cellImages.size;
    layer.replaceChildren();
    button.hidden = visualCount === 0;
    button.disabled = visualCount === 0;
    button.setAttribute('aria-pressed', state.showVisuals ? 'true' : 'false');
    button.textContent = (state.showVisuals ? 'Ocultar visuales' : 'Mostrar visuales') + ' · ' + visualCount;
    button.title = state.query ? 'Limpia la búsqueda para colocar los objetos en su posición original' : 'Mostrar u ocultar imágenes, gráficos y objetos incrustados';
    layer.classList.toggle('off', !state.showVisuals || !!state.query || items.length === 0);
    if (!items.length || !state.showVisuals || state.query) {
      layer.style.width = '';
      layer.style.height = '';
      return;
    }
    const scale = state.zoom / 100;
    let contentWidth = ROW_NUMBER_W * scale + state.visibleCols.reduce((sum, index) => sum + state.widths[index] * scale, 0);
    let contentHeight = HEADER_H * scale + state.viewOffsets[state.viewOffsets.length - 1];
    for (const item of items) {
      const bounds = visualBounds(item);
      contentWidth = Math.max(contentWidth, bounds.x + bounds.width);
      contentHeight = Math.max(contentHeight, bounds.y + bounds.height);
      const node = document.createElement('div');
      node.className = 'visual-object' + (item.kind === 'unsupported' ? ' unsupported' : '');
      node.style.left = bounds.x + 'px';
      node.style.top = bounds.y + 'px';
      node.style.width = bounds.width + 'px';
      node.style.height = bounds.height + 'px';
      node.title = (item.name || 'Objeto de Excel') + ' · clic para ampliar';
      node.setAttribute('role', 'button');
      node.setAttribute('tabindex', '0');
      node.setAttribute('aria-label', (item.name || 'Objeto de Excel') + ', vista ampliada');
      if (item.kind === 'image') {
        const image = document.createElement('img');
        image.src = item.src;
        image.alt = item.name || 'Imagen incrustada en Excel';
        node.appendChild(image);
      } else if (item.kind === 'chart') {
        node.appendChild(window.XLSXViewerVisuals.renderChart(item.chart));
      } else if (item.kind === 'text') {
        node.textContent = item.text;
        node.style.cssText += ';white-space:pre-wrap;overflow:auto;padding:10px;text-align:left;font:13px/1.4 Arial,sans-serif;color:#263442;';
      } else {
        const heading = document.createElement('strong');
        heading.textContent = item.name || 'Objeto de Excel';
        const description = document.createElement('span');
        description.textContent = item.message || 'Vista previa no disponible';
        node.append(heading, description);
      }
      if (item.kind !== 'text' && item.kind !== 'unsupported') {
        const label = document.createElement('span');
        label.className = 'object-label';
        label.textContent = item.name || (item.kind === 'chart' ? 'Gráfico' : 'Imagen');
        node.appendChild(label);
      }
      node.addEventListener('click', () => openVisual(item));
      node.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openVisual(item);
        }
      });
      layer.appendChild(node);
    }
    layer.style.width = contentWidth + 'px';
    layer.style.height = contentHeight + 'px';
  }

  function openVisual(item) {
    const dialog = $('visualDialog');
    const body = $('visualDialogBody');
    body.replaceChildren();
    $('visualDialogTitle').textContent = item.name || 'Vista previa';
    if (item.kind === 'image') {
      const image = document.createElement('img');
      image.src = item.src;
      image.alt = item.alt || item.name || 'Imagen incrustada en Excel';
      body.appendChild(image);
    } else if (item.kind === 'chart') {
      body.appendChild(window.XLSXViewerVisuals.renderChart(item.chart));
    } else {
      const content = document.createElement('div');
      content.className = 'unsupported';
      content.textContent = item.text || item.message || 'Este objeto de Excel no tiene una vista previa compatible.';
      body.appendChild(content);
    }
    if (typeof dialog.showModal === 'function') dialog.showModal();
    else dialog.setAttribute('open', '');
  }

  function selectSheet(index) {
    if (!state.wb || index < 0 || index >= state.wb.SheetNames.length) return;
    state.active = index;
    const ws = state.wb.Sheets[state.wb.SheetNames[index]];
    state.ws = ws;
    state.cellStyles = state.cellStylesBySheet.get(state.wb.SheetNames[index]) || new Map();
    state.visuals = state.visualsBySheet.get(state.wb.SheetNames[index]) || [];
    state.cellImages = state.cellImagesBySheet.get(state.wb.SheetNames[index]) || new Map();
    state.filtered = null;
    state.query = '';
    state.searchText = null;
    state.selectedAddr = '';
    state.selectedRow = null;
    state.renderedStart = -1;
    $('search').value = '';
    $('gridwrap').scrollTop = 0;
    showCell('—', '', true);

    if (!ws || !ws['!ref']) {
      state.rows = []; state.totalRows = 0; state.totalCols = 0;
      state.rowStart = 0; state.colStart = 0;
      state.rowHeights = []; state.viewRows = []; state.visibleRows = []; state.viewOffsets = [0]; state.visibleCols = [];
      state.widths = []; $('thead').replaceChildren(); $('cols').replaceChildren();
      renderStats(); renderBody(true);
      renderVisuals();
      $('csvBtn').disabled = true;
      buildTabs();
      return;
    }

    const range = XLSX.utils.decode_range(ws['!ref']);
    state.totalRows = range.e.r - range.s.r + 1;
    state.totalCols = range.e.c - range.s.c + 1;
    state.rowStart = range.s.r;
    state.colStart = range.s.c;

    state.formulas = new Map();
    for (const key of Object.keys(ws)) {
      if (key.charCodeAt(0) === 33) continue;
      const cell = ws[key];
      if (cell && cell.f) {
        const address = XLSX.utils.decode_cell(key);
        state.formulas.set(address.r + ',' + address.c, '=' + cell.f);
      }
    }
    state.rows = XLSX.utils.sheet_to_json(ws, {
      header: 1, raw: false, defval: '', blankrows: true, range: range
    });
    const rowMetadata = ws['!rows'] || [];
    state.rowHeights = new Array(state.rows.length);
    state.viewRows = [];
    for (let r = 0; r < state.rows.length; r++) {
      const meta = rowMetadata[state.rowStart + r] || {};
      const hidden = !!meta.hidden || meta.hpx === 0 || meta.hpt === 0;
      const px = Number.isFinite(meta.hpx) ? meta.hpx : (Number.isFinite(meta.hpt) ? meta.hpt * 96 / 72 : ROW_H);
      state.rowHeights[r] = Math.max(20, Math.min(400, px || ROW_H));
      if (!hidden) state.viewRows.push(r);
    }
    for (const [address, style] of state.cellStyles) {
      if (!style.wrapText) continue;
      const row = Number(address.split(',')[0]) - state.rowStart;
      if (row >= 0 && row < state.rowHeights.length) state.rowHeights[row] = Math.max(state.rowHeights[row], WRAP_ROW_H);
    }
    rebuildVisibleRows();
    measureColumns(state.useExcelWidths);
    buildTabs();
    renderHeader();
    renderStats();
    renderBody(true);
    renderVisuals();
    $('csvBtn').disabled = false;
    const activeTab = $('tabs').children[state.active];
    if (activeTab && activeTab.scrollIntoView) activeTab.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function loadWorkbook(wb, name, cellStylesBySheet, visualData) {
    if (!wb || !wb.SheetNames || !wb.SheetNames.length) throw new Error('El libro no contiene hojas.');
    clearVisualUrls(state.visualUrls);
    state.wb = wb;
    state.name = name;
    state.cellStylesBySheet = cellStylesBySheet || new Map();
    state.visualsBySheet = visualData && visualData.bySheet ? visualData.bySheet : new Map();
    state.cellImagesBySheet = visualData && visualData.cellImagesBySheet ? visualData.cellImagesBySheet : new Map();
    state.visualUrls = visualData && visualData.urls ? visualData.urls : [];
    state.showVisuals = true;
    state.zoom = 100;
    document.documentElement.style.setProperty('--zoom-scale', '1');
    document.documentElement.style.setProperty('--row-number-width', ROW_NUMBER_W + 'px');
    $('zoomReset').textContent = '100%';
    state.active = 0;
    $('empty').hidden = true;
    $('viewer').hidden = false;
    $('meta').textContent = name + ' · ' + wb.SheetNames.length + (wb.SheetNames.length === 1 ? ' hoja' : ' hojas');
    selectSheet(0);
  }

  async function parseBuffer(buffer, name) {
    setBusy(true, 'Leyendo ' + name + '…');
    let visualData = null;
    try {
      await new Promise((resolve) => setTimeout(resolve, 30));
      const isOoxml = /\.(xlsx|xlsm)$/i.test(name);
      const extractVisualStyles = isOoxml && buffer.byteLength <= MAX_OOXML_FEATURE_SIZE;
      const options = { type: 'array', cellDates: true, cellStyles: true, cellNF: true, bookFiles: extractVisualStyles };
      const wb = XLSX.read(new Uint8Array(buffer), options);
      const cellStylesBySheet = extractVisualStyles ? readXlsxCellStyles(wb) : new Map();
      if (extractVisualStyles && window.XLSXViewerVisuals) {
        try { visualData = window.XLSXViewerVisuals.extract(wb); }
        catch (error) { console.warn('No se pudieron extraer los objetos visuales', error); }
      }
      if (wb.files) delete wb.files;
      if (wb.keys) delete wb.keys;
      loadWorkbook(wb, name, cellStylesBySheet, visualData);
      const objectCount = visualData && visualData.count ? visualData.count : 0;
      const toastMessage = objectCount
        ? 'Listo: ' + name + ' · ' + objectCount + (objectCount === 1 ? ' objeto visual' : ' objetos visuales')
        : 'Listo: ' + name;
      toast(isOoxml && !extractVisualStyles ? toastMessage + ' · modo ligero: formato y objetos omitidos' : toastMessage);
      visualData = null;
    } catch (error) {
      if (visualData) clearVisualUrls(visualData.urls);
      console.error(error);
      const message = String(error && error.message ? error.message : error);
      toast(/password|encrypt/i.test(message) ? 'El archivo está protegido con contraseña.' : 'No se pudo leer el archivo: ' + message, true);
    } finally {
      setBusy(false);
    }
  }

  function readFile(file) {
    if (!file) return;
    if (file.size > 120 * 1024 * 1024) {
      toast('El archivo supera 120 MB; el navegador puede tardar o quedarse sin memoria.', true);
    }
    const reader = new FileReader();
    reader.onload = (event) => parseBuffer(event.target.result, file.name);
    reader.onerror = () => toast('No se pudo abrir el archivo.', true);
    reader.readAsArrayBuffer(file);
  }

  function applySearch(value) {
    const q = value.trim().toLowerCase();
    state.query = q;
    state.renderedStart = -1;
    if (!q) {
      state.filtered = null;
    } else {
      if (!state.searchText) {
        state.searchText = state.rows.map((row) => row.join('\u0001').toLowerCase());
      }
      const hits = [];
      for (const i of state.viewRows) {
        if (state.searchText[i].indexOf(q) >= 0) hits.push(i);
      }
      state.filtered = hits;
    }
    rebuildVisibleRows();
    $('gridwrap').scrollTop = 0;
    renderBody(true);
    renderVisuals();
    renderStats();
  }

  let searchTimer = null;
  $('search').addEventListener('input', (event) => {
    clearTimeout(searchTimer);
    const value = event.target.value;
    searchTimer = setTimeout(() => applySearch(value), 140);
  });

  $('gridwrap').addEventListener('scroll', () => {
    if (state.scrollRaf) return;
    state.scrollRaf = true;
    requestAnimationFrame(() => {
      state.scrollRaf = false;
      renderBody(false);
    });
  }, { passive: true });

  $('gridwrap').addEventListener('click', (event) => {
    const td = event.target.closest ? event.target.closest('td') : null;
    if (!td || td.dataset.row == null) return;
    const rowIndex = Number(td.dataset.row);
    const colIndex = Number(td.dataset.col);
    state.selectedAddr = td.dataset.addr;
    state.selectedRow = rowIndex;
    const row = state.rows[rowIndex] || [];
    let value = row[colIndex] == null ? '' : String(row[colIndex]);
    const absolute = (state.rowStart + rowIndex) + ',' + (state.colStart + colIndex);
    const formula = state.formulas.get(absolute);
    const cellImage = state.cellImages.get(absolute);
    if (!value && formula) value = formula;
    if (!value && cellImage) value = cellImage.alt || cellImage.name || 'Imagen insertada en la celda';
    showCell(td.dataset.addr, value, false);
    state.renderedStart = -1;
    renderBody(true);
  });

  $('copyCell').addEventListener('click', async () => {
    if (!state.cellValue) return;
    try {
      await navigator.clipboard.writeText(state.cellValue);
      toast('Contenido copiado');
    } catch (error) {
      toast('No se pudo copiar al portapapeles', true);
    }
  });

  $('wrapBtn').addEventListener('click', () => {
    state.wrapText = !state.wrapText;
    $('wrapBtn').setAttribute('aria-pressed', state.wrapText ? 'true' : 'false');
    $('grid').classList.toggle('wrap-text', state.wrapText);
    rebuildVisibleRows();
    state.renderedStart = -1;
    $('gridwrap').scrollTop = 0;
    renderBody(true);
    renderVisuals();
  });

  $('fitBtn').addEventListener('click', () => {
    state.useExcelWidths = !state.useExcelWidths;
    $('fitBtn').textContent = state.useExcelWidths ? 'Ajustar columnas' : 'Anchos Excel';
    $('fitBtn').title = state.useExcelWidths ? 'Usar los anchos guardados en el archivo' : 'Restaurar los anchos del archivo';
    measureColumns(state.useExcelWidths);
    renderHeader();
    state.renderedStart = -1;
    renderBody(true);
    renderVisuals();
  });

  $('visualBtn').addEventListener('click', () => {
    if (state.query) {
      toast('Limpia la búsqueda para mostrar los objetos en su posición original.');
      return;
    }
    state.showVisuals = !state.showVisuals;
    renderBody(true);
    renderVisuals();
    renderStats();
  });

  function setZoom(value) {
    const next = Math.max(50, Math.min(200, Math.round(value / 10) * 10));
    if (next === state.zoom) return;
    const wrap = $('gridwrap');
    const verticalProgress = wrap.scrollHeight > wrap.clientHeight
      ? wrap.scrollTop / (wrap.scrollHeight - wrap.clientHeight) : 0;
    const horizontalProgress = wrap.scrollWidth > wrap.clientWidth
      ? wrap.scrollLeft / (wrap.scrollWidth - wrap.clientWidth) : 0;
    state.zoom = next;
    document.documentElement.style.setProperty('--zoom-scale', String(next / 100));
    document.documentElement.style.setProperty('--row-number-width', (ROW_NUMBER_W * next / 100) + 'px');
    $('zoomReset').textContent = next + '%';
    rebuildVisibleRows();
    renderHeader();
    state.renderedStart = -1;
    renderBody(true);
    renderVisuals();
    requestAnimationFrame(() => {
      wrap.scrollTop = verticalProgress * Math.max(0, wrap.scrollHeight - wrap.clientHeight);
      wrap.scrollLeft = horizontalProgress * Math.max(0, wrap.scrollWidth - wrap.clientWidth);
      renderBody(true);
      renderVisuals();
    });
  }

  $('zoomOut').addEventListener('click', () => setZoom(state.zoom - 10));
  $('zoomIn').addEventListener('click', () => setZoom(state.zoom + 10));
  $('zoomReset').addEventListener('click', () => setZoom(100));

  $('closeVisualDialog').addEventListener('click', () => $('visualDialog').close());
  $('visualDialog').addEventListener('click', (event) => {
    if (event.target === $('visualDialog')) $('visualDialog').close();
  });

  window.addEventListener('resize', () => { renderBody(true); renderVisuals(); });

  function demoWorkbook() {
    const aoa = [
      ['PROJECT INFEST — ejemplo de visor', '', '', '', ''],
      ['Contrato', 'Plaga', 'Cantidad', 'Importe', 'Fecha'],
      ['Residencial 01', 'Cucaracha', 12, 420.5, '2026-10-20'],
      ['Residencial 01', 'Rata', 4, 310, '2026-10-20'],
      ['Residencial 02', 'Avispa', 7, 285.75, '2026-10-21'],
      ['Nave industrial', 'Cucaracha', 31, 980, '2026-10-22'],
      ['Oficina centro', 'Rata', 2, 160, '2026-10-22'],
      ['Garaje', 'Avispa', 5, 240.25, '2026-10-23'],
      ['Total', '', '', 2396.5, '']
    ];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 22 }, { wch: 14 }, { wch: 11 }, { wch: 12 }, { wch: 12 }];
    const setDemoStyle = (r, c, style) => {
      const address = XLSX.utils.encode_cell({ r, c });
      const cell = ws[address] || (ws[address] = { t: 's', v: '' });
      cell.s = style;
    };
    const titleStyle = { patternType:'solid', fgColor:{ rgb:'17352B' }, font:{ name:'Aptos Display', sz:16, bold:1, color:{ rgb:'FFFFFF' } }, alignment:{ vertical:'center' } };
    const headerStyle = { patternType:'solid', fgColor:{ rgb:'285B49' }, font:{ name:'Aptos', sz:10, bold:1, color:{ rgb:'FFFFFF' } }, alignment:{ horizontal:'center', vertical:'center' } };
    const totalStyle = { patternType:'solid', fgColor:{ rgb:'E5F0E8' }, font:{ name:'Aptos', sz:10, bold:1, color:{ rgb:'214A38' } }, alignment:{ vertical:'center' } };
    for (let c = 0; c < 5; c++) {
      setDemoStyle(0, c, titleStyle);
      setDemoStyle(1, c, headerStyle);
      for (let r = 2; r < 8; r++) {
        const fill = r % 2 ? 'F4F7F5' : 'FFFFFF';
        setDemoStyle(r, c, { patternType:'solid', fgColor:{ rgb:fill }, font:{ name:'Aptos', sz:10, color:{ rgb:'26342D' } }, alignment:{ vertical:'center' } });
      }
      setDemoStyle(8, c, totalStyle);
    }
    for (let r = 2; r <= 8; r++) {
      setDemoStyle(r, 2, { patternType:'solid', fgColor:{ rgb:r === 8 ? 'E5F0E8' : (r % 2 ? 'F4F7F5' : 'FFFFFF') }, font:{ name:'Aptos', sz:10, bold:r === 8 ? 1 : 0, color:{ rgb:r === 8 ? '214A38' : '26342D' } }, alignment:{ horizontal:'right', vertical:'center' } });
      setDemoStyle(r, 3, { patternType:'solid', fgColor:{ rgb:r === 8 ? 'E5F0E8' : (r % 2 ? 'F4F7F5' : 'FFFFFF') }, font:{ name:'Aptos', sz:10, bold:r === 8 ? 1 : 0, color:{ rgb:r === 8 ? '214A38' : '26342D' } }, alignment:{ horizontal:'right', vertical:'center' } });
    }
    ws['!rows'] = [];
    ws['!rows'][0] = { hpx: 44 };
    ws['!rows'][1] = { hpx: 34 };
    ws['!rows'][8] = { hpx: 36 };
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Ejemplo');
    const notes = XLSX.utils.aoa_to_sheet([
      ['Voryda Sheet'],
      ['Arrastra un .xlsx, .xlsm, .xls o .csv para abrirlo.'],
      ['La búsqueda filtra filas en la hoja activa.'],
      ['Pulsa el gráfico para abrir la vista ampliada.'],
      ['Exportar CSV descarga la hoja activa.']
    ]);
    XLSX.utils.book_append_sheet(wb, notes, 'Ayuda');
    const demoVisuals = new Map([['Ejemplo', [{
      kind:'chart', name:'Unidades por tipo de plaga',
      anchor:{ from:{ col:5, row:1, colOff:0, rowOff:0 }, width:440, height:270 },
      chart:{
        title:'Unidades por tipo de plaga', type:'bar',
        series:[{ name:'Unidades', categories:['Cucaracha','Rata','Avispa'], values:[43,6,12] }]
      }
    }]]]);
    loadWorkbook(wb, 'ejemplo.xlsx', new Map(), { bySheet:demoVisuals, urls:[], count:1 });
  }

  $('openBtn').addEventListener('click', () => $('fileInput').click());
  $('pickBtn').addEventListener('click', () => $('fileInput').click());
  $('demoBtn').addEventListener('click', demoWorkbook);
  $('fileInput').addEventListener('change', (event) => {
    const file = event.target.files && event.target.files[0];
    event.target.value = '';
    if (file) readFile(file);
  });

  $('csvBtn').addEventListener('click', () => {
    if (!state.wb) return;
    const ws = state.wb.Sheets[state.wb.SheetNames[state.active]];
    if (!ws) return;
    const csv = XLSX.utils.sheet_to_csv(ws);
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = state.wb.SheetNames[state.active].replace(/[\\/:*?"<>|]+/g, '_') + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  });

  let dragDepth = 0;
  const veil = $('veil');
  window.addEventListener('dragenter', (event) => {
    event.preventDefault();
    dragDepth++;
    veil.classList.add('on');
  });
  window.addEventListener('dragover', (event) => event.preventDefault());
  window.addEventListener('dragleave', (event) => {
    event.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) veil.classList.remove('on');
  });
  window.addEventListener('drop', (event) => {
    event.preventDefault();
    dragDepth = 0;
    veil.classList.remove('on');
    const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
    if (file) readFile(file);
    else toast('Suelta un archivo .xlsx, .xlsm, .xls o .csv.', true);
  });

  window.addEventListener('keydown', (event) => {
    const mod = event.ctrlKey || event.metaKey;
    if (mod && event.key.toLowerCase() === 'o') {
      event.preventDefault();
      $('fileInput').click();
    } else if (mod && (event.key === '+' || (event.key === '=' && event.shiftKey) || event.code === 'NumpadAdd') && state.wb) {
      event.preventDefault();
      setZoom(state.zoom + 10);
    } else if (mod && (event.key === '-' || event.code === 'NumpadSubtract') && state.wb) {
      event.preventDefault();
      setZoom(state.zoom - 10);
    } else if (event.key === 'Escape' && state.wb) {
      const search = $('search');
      if (document.activeElement === search && search.value) {
        search.value = '';
        applySearch('');
      }
    } else if (state.wb && !mod && (event.key === 'ArrowLeft' || event.key === 'ArrowRight')) {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      event.preventDefault();
      const next = state.active + (event.key === 'ArrowRight' ? 1 : -1);
      if (next >= 0 && next < state.wb.SheetNames.length) selectSheet(next);
    }
  });

  const params = new URLSearchParams(window.location.search);
  if (params.get('demo') === '1') demoWorkbook();
  window.addEventListener('beforeunload', () => clearVisualUrls(state.visualUrls));
})();
</script>
</body>
